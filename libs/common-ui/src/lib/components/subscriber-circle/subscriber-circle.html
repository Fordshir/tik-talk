@if (profile(); as profile) {
  <a
    #anchor
    class="subscriber-avatar-btn"
    (click)="onClick()"
    [ngClass]="{'chosen': isChosen()}"
    [routerLink]="isDisabled() ? null : ['/profile', profile.id]"
  >
    <img class="subscriber-avatar-img" [src]="profile.avatarUrl | imgUrl" />
  </a>

  @if (mouseOver()) {
    <tt-portal [host]="anchor">
      <div class="tooltip">
        {{profile.firstName}}
        {{profile.lastName}}
      </div>
    </tt-portal>
  }
}
