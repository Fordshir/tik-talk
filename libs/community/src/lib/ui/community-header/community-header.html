@if (community(); as community) {
  <div class="avatar-wrapper">
    <tt-avatar-circle [avatarUrl]="community.avatarUrl"></tt-avatar-circle>
    <div class="edit-avatar medium-text">
      Изменить фотографию
      <svg class="svg16" icon="pencil"></svg>
    </div>
  </div>
  @if (community.admin.id === myId()){
    <div class="community-name-form" [formGroup]="form">
      <input type="text" class="community-name-input h4" formControlName="name">
      <button class="community-name-button" (click)="onDelete()"><svg class="svg10" icon="cross"></svg></button>
    </div>
  }
  @else {
    <div class="community-name">
      <h1 class="h4 mb4">{{ community.name }}</h1>
    </div>
  }
}
