@if (isMyCommunity()){
    <tt-post-input
      [isMyCommunity]="isMyCommunity()"
      [community]="community()"
      (created)="onCreatePost($event)"
    ></tt-post-input>
  }
@else if (!isCommunity()){
  <tt-post-input
    (created)="onCreatePost($event)"
  ></tt-post-input>
}
<div class="post-area">
  @for (post of feed(); track post.id) {
    <tt-post [post]="post"></tt-post>
  }
</div>
